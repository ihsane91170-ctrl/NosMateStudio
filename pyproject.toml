[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nosmate-studio"
version = "0.1.0a0"
description = "Application Windows de préparation automatisée d'une session NosMate."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Ihsane Benachour" }
]
dependencies = [
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
